name: Quality review
on:
  push:
    branches: ['improve/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bundle exact source for reproducible review
        run: git archive --format=tar HEAD > source-review.tar
      - uses: actions/upload-artifact@v4
        with:
          name: source-review
          path: source-review.tar
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-browser-verification
          path: |
            playwright-report/
            test-results/
          retention-days: 14
