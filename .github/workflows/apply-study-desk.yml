name: Verify study desk redesign
on:
  push:
    branches: [design/study-desk-20261013]
    paths: [.github/workflows/apply-study-desk.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed files with base and output checksums
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json
          encoded=''.join(Path(f'scripts/design-payload.{i}').read_text().strip() for i in [1,2,3])
          raw=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(raw).hexdigest()=='159f0185d06b01c020130296e03d1a51a6c75d275db3a5736dff5a126b2aab7e','Payload checksum mismatch'
          files=json.loads(gzip.decompress(raw))
          for name,item in files.items():
              p=Path(name)
              assert '..' not in p.parts and not p.is_absolute()
              if 'base_sha256' in item:
                  old=p.read_text()
                  assert hashlib.sha256(old.encode()).hexdigest()==item['base_sha256'],f'Base changed: {name}'
              if 'content' in item:
                  result=item['content']
              else:
                  result=old
                  for start,end,text in reversed(item['edits']):
                      result=result[:start]+text+result[end:]
              assert hashlib.sha256(result.encode()).hexdigest()==item['sha256'],f'Output mismatch: {name}'
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(result)
              print('Verified',name,item['sha256'])
          # Keep all existing engine tests; replace only the obsolete configurable UI contract.
          p=Path('tests/drill.test.js');text=p.read_text()
          text=text.replace('drillNextButton,drillSettings,drillStatus','drillNextButton,drillStatus')
          marker="test('UI communicates multi-select confirmation, shortage, finite and infinite continuation'"
          assert marker in text
          text=text[:text.index(marker)]+'''test('UI has one continuous next action and explicit multi-select confirmation',()=>{
           const p=createDrill(['a','b'],{batchSize:10}),s={...asSession(p),index:1,answers:{a:0,b:1}};
           assert.match(drillNextButton({...s,checked:[],answers:{}},false,true),/提交多选答案/);
           assert.match(drillNextButton({...s,checked:[],answers:{}},false,true),/disabled/);
           assert.match(drillNextButton(s,false,false),/选择后即显示解析/);
           assert.match(drillNextButton(s,true),/下一题/);
           assert.match(drillNextButton({...s,drill:{...s.drill,endless:true}},true),/下一题/);
           assert.doesNotMatch(drillNextButton(s,true),/下一组|完成本组|配置/);
           assert.match(drillStatus(s,1),/50%/);
          });
          '''
          p.write_text(text)
          # Update selectors for the redesigned home, without weakening behavioral assertions.
          for name in ['flow.spec.js','academy.spec.js','fund.spec.js']:
              p=Path('tests/browser')/name;text=p.read_text()
              text=text.replace('把知识练熟，再从容开考。','把每一次选择，变成理解。')
              text=text.replace("'模拟考试'","'学习空间'")
              text=text.replace('.progress-ring strong','.attempted-count')
              text=text.replace('.progress-ring','.desk-progress > div:first-child')
              if name=='fund.spec.js':
                  text=text.replace("name:'中国大陆基金从业资格'","name:'把每一次选择，变成理解。'")
              p.write_text(text)
          p=Path('README.md');text=p.read_text()
          note='> 2026-10-13 界面更新：学习书桌首页与专注答题页已重设计。随机刷题现在一键进入当前科目全部题库，不再设置范围、题数或模式；单选即时解析、多选提交解析、连续下一题。详见 [交互说明](docs/random-practice.md) 与 [设计说明](docs/frontend-design.md)。旧版下方的随机 X 题配置说明已由此取代。\n\n'
          p.write_text(note+text)
          PY
      - name: Commit actual source files to verification branch
        run: |
          git rm scripts/design-payload.1 scripts/design-payload.2 scripts/design-payload.3 .github/workflows/apply-study-desk.yml
          git add index.html src docs tests README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: redesign study desk and make random practice immediate'
          git push origin HEAD:design/study-desk-20261013
          git rev-parse HEAD > /tmp/verified-source-commit.txt
      - run: npm ci
      - name: Unit and content tests
        run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser regression
        run: npx playwright test
      - run: npm run build
      - name: Package verification evidence and exact source
        if: always()
        run: |
          mkdir -p design-evidence
          cp /tmp/verified-source-commit.txt design-evidence/ 2>/dev/null || true
          tar --exclude=.git --exclude=node_modules --exclude=design-evidence --exclude=playwright-report --exclude=test-results -czf design-evidence/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-desk-verification
          path: |
            design-evidence/
            playwright-report/
            test-results/
