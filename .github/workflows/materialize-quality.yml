name: Validate quality update
on:
  push:
    branches: [improve/20261013-quality-workbench]
    paths: ['.github/workflows/materialize-quality.yml']
permissions:
  contents: write
concurrency:
  group: materialize-quality
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.ref == 'refs/heads/improve/20261013-quality-workbench'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-verified reviewed patch
        run: |
          python3 - <<'PY'
          import bz2, hashlib, pathlib, subprocess
          root = pathlib.Path('.github/quality-payload')
          patch = bz2.decompress(b''.join((root / f'part-{i}.bz2').read_bytes() for i in range(6)))
          expected = '4f61924fbf8616f1023bab49141c69384500f754be67ee9ee9f65eb7163eae5e'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          path = pathlib.Path('/tmp/quality.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(path)], check=True)
          subprocess.run(['git', 'apply', str(path)], check=True)
          # Reload after seeding storage so the app reads the new fixture state.
          path = pathlib.Path('tests/browser/review.spec.js')
          text = path.read_text()
          before = '{key:subject.practiceKey,value});}'
          assert text.count(before) == 1
          path.write_text(text.replace(before, '{key:subject.practiceKey,value});await page.reload();}'))
          PY
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - name: Commit verified source on improvement branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          branch='improve/20261013-quality-workbench'
          actual="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$actual" = "$EXPECTED_HEAD"
          rm -r .github/quality-payload
          rm .github/workflows/materialize-quality.yml
          git add README.md index.html src tests .github/quality-payload .github/workflows/materialize-quality.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add 160 reviewed case studies and personal review workbench'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Archive executed source
        if: always()
        run: tar -czf /tmp/executed-source.tar.gz README.md index.html src tests scripts package.json package-lock.json playwright.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-verification
          path: |
            playwright-report/
            test-results/
            /tmp/executed-source.tar.gz
          retention-days: 14
